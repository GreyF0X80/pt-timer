<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050b14">
    <title>KrioPlanet Timer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ==================== PALETTE KRIOPLANET & RESET ==================== */
        :root {
            --bg-dark: #050b14;
            --bg-card: rgba(15, 30, 46, 0.75);
            --primary-cyan: #00f0ff;
            --primary-blue: #0072ff;
            --glow-cyan: rgba(0, 240, 255, 0.35);
            --work-green: #38ef7d;
            --rest-red: #ff4d6d;
            --warning-yellow: #ffc107;
            --extra-blue: #00b4d8;
            --text-main: #ffffff;
            --text-muted: #8a99ad;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background: radial-gradient(circle at 50% 20%, #0d1e30 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            font-family: 'Poppins', -apple-system, 'Helvetica Neue', sans-serif;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        #app {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100dvh;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            /* Gestione dinamica Safe Area per iOS WebApp */
            padding-top: calc(env(safe-area-inset-top, 0px) + 60px);
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
            padding-left: 16px;
            padding-right: 16px;
            background: transparent;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }

        /* ==================== LOGO HEADER (Posizionato sotto il Notch) ==================== */
        #logo-header {
            position: fixed;
            top: calc(env(safe-area-inset-top, 0px) + 10px);
            left: 16px;
            z-index: 1000;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 30, 46, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 6px 14px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), 0 0 10px var(--glow-cyan);
            transition: all 0.2s ease;
            text-decoration: none;
        }
        #logo-header:active {
            transform: scale(0.95);
        }
        #logo-header img {
            height: 28px;
            width: auto;
            display: block;
            filter: brightness(0) invert(1) drop-shadow(0 0 4px var(--primary-cyan));
            transition: filter 0.3s ease;
        }
        #logo-header .brand-name {
            font-size: 0.9rem;
            font-weight: 700;
            background: linear-gradient(45deg, #fff, var(--primary-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        /* ==================== DRAWER ==================== */
        #drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: 340px;
            max-width: 85vw;
            height: 100%;
            background: rgba(10, 20, 32, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid rgba(0, 240, 255, 0.2);
            z-index: 1100;
            transform: translateX(-100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            padding-top: calc(env(safe-area-inset-top, 0px) + 20px);
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
            padding-left: 20px;
            padding-right: 20px;
            box-shadow: 10px 0 30px rgba(0,0,0,0.8);
            color: var(--text-main);
        }
        #drawer.open {
            transform: translateX(0);
        }

        #drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
        }
        #drawer-header .logo-large {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #drawer-header .logo-large img {
            height: 38px;
            width: auto;
            filter: brightness(0) invert(1) drop-shadow(0 0 4px var(--primary-cyan));
        }
        #drawer-header .logo-large span {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(45deg, #fff, var(--primary-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        #drawer-close {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 1.2rem;
            color: var(--primary-cyan);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        #drawer-close:active {
            transform: scale(0.85);
        }

        /* ==================== OVERLAY ==================== */
        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 1050;
            display: none;
            transition: opacity 0.3s ease;
            opacity: 0;
        }
        #overlay.active {
            display: block;
            opacity: 1;
        }

        /* ==================== IMPOSTAZIONI DENTRO IL DRAWER ==================== */
        #drawer .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            border-radius: 50px;
            margin-bottom: 8px;
        }
        #drawer .row label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-main);
            min-width: 50px;
        }
        #drawer .row .controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #drawer .row .controls button {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--primary-cyan);
            color: var(--primary-cyan);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.15s ease;
        }
        #drawer .row .controls button:active {
            background: var(--primary-cyan);
            color: #000;
            transform: scale(0.9);
        }
        #drawer .row .controls span {
            font-size: 1.05rem;
            font-weight: 700;
            min-width: 30px;
            text-align: center;
            color: var(--primary-cyan);
        }
        #drawer .extra-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            min-width: 25px;
        }

        #drawer .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            border-radius: 50px;
            margin-bottom: 8px;
        }
        #drawer .toggle-row label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #drawer .switch {
            position: relative;
            width: 44px;
            height: 24px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 22px;
            cursor: pointer;
            transition: background 0.3s;
            touch-action: manipulation;
            flex-shrink: 0;
        }
        #drawer .switch.active {
            background: linear-gradient(90deg, var(--primary-cyan), var(--primary-blue));
            box-shadow: 0 0 10px var(--glow-cyan);
        }
        #drawer .switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #drawer .switch.active::after {
            transform: translateX(20px);
        }

        /* SECTION SALVA PRESET DENTRO IL DRAWER */
        .drawer-save-section {
            margin-top: 14px;
            background: rgba(0, 240, 255, 0.03);
            border: 1px dashed rgba(0, 240, 255, 0.25);
            border-radius: 14px;
            padding: 12px;
        }
        .drawer-save-section input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            font-size: 0.8rem;
            outline: none;
            margin-bottom: 8px;
            user-select: text;
        }
        .drawer-save-section input:focus {
            border-color: var(--primary-cyan);
        }
        .btn-save-drawer {
            width: 100%;
            background: var(--primary-cyan);
            color: #000;
            border: none;
            padding: 8px 0;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }
        .btn-save-drawer:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        #drawer #preset-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 16px 0 10px 0;
        }
        #drawer .preset-btn {
            flex: 1 1 40%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            padding: 8px 0;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }
        #drawer .preset-btn:active {
            transform: scale(0.95);
        }
        #drawer .preset-btn.active {
            border-color: var(--primary-cyan);
            color: #000;
            background: var(--primary-cyan);
            box-shadow: 0 0 12px var(--glow-cyan);
        }

        /* BOTTONE LIBRERIA WORKOUT */
        #btn-open-library {
            width: 100%;
            margin-top: 10px;
            padding: 12px 16px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(0, 114, 255, 0.15));
            border: 1px solid var(--primary-cyan);
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        #btn-open-library:active {
            transform: scale(0.97);
            background: rgba(0, 240, 255, 0.25);
        }

        /* ==================== MODALE LIBRERIA WORKOUT ==================== */
        #library-modal {
            position: fixed;
            inset: 0;
            z-index: 1200;
            background: rgba(5, 11, 20, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            display: none;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s ease;
            padding-top: calc(env(safe-area-inset-top, 0px) + 20px);
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
            padding-left: 16px;
            padding-right: 16px;
        }
        #library-modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
        }
        .modal-header h2 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal-close-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 1.2rem;
            color: var(--primary-cyan);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            max-width: 700px;
            width: 100%;
            margin: 16px auto 0 auto;
            padding-right: 4px;
        }

        .search-box {
            position: relative;
            margin-bottom: 16px;
        }
        .search-box input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 10px 16px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            user-select: text;
        }
        .search-box input:focus {
            border-color: var(--primary-cyan);
            box-shadow: 0 0 10px var(--glow-cyan);
        }

        .library-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .library-item {
            background: rgba(15, 30, 46, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }
        .library-item:hover {
            border-color: rgba(0, 240, 255, 0.3);
            background: rgba(15, 30, 46, 0.95);
        }
        .library-item-info {
            flex: 1;
        }
        .library-item-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }
        .library-item-details {
            font-size: 0.72rem;
            color: var(--text-muted);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .library-item-details span {
            color: var(--primary-cyan);
            font-weight: 600;
        }
        .library-item-actions {
            display: flex;
            gap: 6px;
        }
        .btn-action-load {
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid var(--primary-cyan);
            color: var(--primary-cyan);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-action-load:active {
            background: var(--primary-cyan);
            color: #000;
        }
        .btn-action-del {
            background: rgba(255, 77, 109, 0.1);
            border: 1px solid var(--rest-red);
            color: var(--rest-red);
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-action-del:active {
            background: var(--rest-red);
            color: #fff;
        }
        .empty-library-msg {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 30px 0;
        }

        /* ==================== TIMER DISPLAY ==================== */
        #timer-display {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
            margin: auto 0;
        }

        #rounds-info {
            font-size: clamp(0.75rem, 3vw, 1.2rem);
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 2px;
            z-index: 2;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        #big-number {
            position: relative;
            font-size: clamp(3.2rem, 20vw, 9.5rem);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            transition: color 0.2s ease, text-shadow 0.2s ease;
            color: var(--text-main);
            letter-spacing: -1px;
            z-index: 2;
            text-align: center;
            width: 100%;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }

        #phase-label {
            font-size: clamp(0.8rem, 3.5vw, 1.4rem);
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text-muted);
            transition: color 0.2s ease, text-shadow 0.2s ease;
            text-align: center;
            padding: 0 10px;
            z-index: 2;
            margin-top: 2px;
        }

        #progress-ring-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(260px, 78vw, 500px);
            height: clamp(260px, 78vw, 500px);
            pointer-events: none;
            z-index: 0;
            overflow: visible;
            filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.35));
        }
        
        #ring-outer-bg,
        #ring-outer,
        #ring-inner-bg,
        #ring-inner {
            transition: stroke-dashoffset 0.15s linear, stroke 0.3s ease;
        }

        /* PALLINI DI AVANZAMENTO */
        #progress-dots-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 0;
            flex-shrink: 0;
            min-height: 24px;
        }
        #progress-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            max-width: 85%;
        }
        .dot {
            width: clamp(7px, 1.5vw, 11px);
            height: clamp(7px, 1.5vw, 11px);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        .dot.done {
            background: var(--work-green);
            box-shadow: 0 0 8px rgba(56, 239, 125, 0.5);
        }
        .dot.current {
            background: var(--warning-yellow);
            box-shadow: 0 0 8px rgba(255, 193, 7, 0.6);
            transform: scale(1.2);
        }
        .dot.extra-dot {
            background: var(--extra-blue);
            box-shadow: 0 0 8px rgba(0, 180, 216, 0.6);
            transform: scale(1.2);
        }

        /* ==================== CONTROLLI ==================== */
        #controls {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
            padding-bottom: 8px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .ctrl-btn {
            height: 52px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            font-size: clamp(0.85rem, 1.8vw, 1rem);
            font-weight: 700;
            padding: 0 18px;
            min-width: 60px;
            flex: 1;
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            letter-spacing: 1.5px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
            backdrop-filter: blur(8px);
        }
        .ctrl-btn:active {
            transform: scale(0.95);
        }
        #btn-start {
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-blue));
            color: #000;
            border: none;
            box-shadow: 0 4px 20px var(--glow-cyan);
        }
        #btn-start.idle {
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-blue));
            color: #000;
        }
        #btn-start.running {
            background: linear-gradient(135deg, var(--warning-yellow), #f39c12);
            color: #000;
            box-shadow: 0 4px 20px rgba(255, 193, 7, 0.4);
        }
        #btn-skip-back, #btn-skip-forward {
            background: rgba(0, 240, 255, 0.1);
            border-color: rgba(0, 240, 255, 0.3);
            color: var(--primary-cyan);
            display: none;
            flex: 0.6;
            min-width: 50px;
        }
        #btn-skip-back:hover, #btn-skip-forward:hover {
            background: rgba(0, 240, 255, 0.2);
        }
        #btn-stop {
            background: rgba(255, 77, 109, 0.15);
            border-color: rgba(255, 77, 109, 0.4);
            color: var(--rest-red);
            display: none;
            flex: 0.5;
            min-width: 45px;
        }

        #btn-pause, #btn-skip, #btn-reset { display: none !important; }

        /* ==================== COLORI DINAMICI FASI ==================== */
        .phase-work #big-number, .phase-work #phase-label { color: var(--work-green); text-shadow: 0 0 25px rgba(56, 239, 125, 0.4); }
        .phase-rest #big-number, .phase-rest #phase-label { color: var(--rest-red); text-shadow: 0 0 25px rgba(255, 77, 109, 0.4); }
        .phase-rest-warning #big-number, .phase-rest-warning #phase-label { color: var(--warning-yellow); text-shadow: 0 0 25px rgba(255, 193, 7, 0.5); }
        .phase-extra #big-number, .phase-extra #phase-label { color: var(--extra-blue); text-shadow: 0 0 25px rgba(0, 180, 216, 0.5); }
        .phase-countdown #big-number, .phase-countdown #phase-label { color: var(--primary-cyan); text-shadow: 0 0 25px var(--glow-cyan); }
        .phase-finished #big-number, .phase-finished #phase-label { color: var(--work-green); text-shadow: 0 0 30px rgba(56, 239, 125, 0.6); }

        @media (max-height: 680px) {
            #big-number { font-size: clamp(2.8rem, 16vw, 6rem); }
            #progress-ring-container { width: clamp(220px, 72vw, 360px); height: clamp(220px, 72vw, 360px); }
            .ctrl-btn { height: 44px; }
        }
    </style>
</head>
<body>

    <!-- LOGO HEADER -->
    <button id="logo-header" aria-label="Apri menu KrioPlanet">
        <img src="Logo-Blu.svg" alt="KrioPlanet" id="logo-img">
        <span class="brand-name">KRIOPLANET</span>
    </button>

    <!-- OVERLAY -->
    <div id="overlay"></div>

    <!-- DRAWER -->
    <div id="drawer">
        <div id="drawer-header">
            <div class="logo-large">
                <img src="Logo-Blu.svg" alt="KrioPlanet">
                <span>KRIOPLANET</span>
            </div>
            <button id="drawer-close" aria-label="Chiudi menu">✕</button>
        </div>

        <!-- IMPOSTAZIONI -->
        <div id="setup-inside-drawer">
            <div class="row">
                <label>⏱ Lavoro</label>
                <div class="controls">
                    <button id="dec-work">−</button>
                    <span id="val-work">30</span>
                    <button id="inc-work">+</button>
                </div>
            </div>
            <div class="row">
                <label>🧘🏻‍♀️ Recupero</label>
                <div class="controls">
                    <button id="dec-rest">−</button>
                    <span id="val-rest">15</span>
                    <button id="inc-rest">+</button>
                </div>
            </div>
            <div class="row">
                <label>🔁 Giri</label>
                <div class="controls">
                    <button id="dec-rounds">−</button>
                    <span id="val-rounds">12</span>
                    <button id="inc-rounds">+</button>
                </div>
            </div>
            <div class="row">
                <label>🕝 Extra ogni</label>
                <div class="controls">
                    <button id="dec-extra-every">−</button>
                    <span id="val-extra-every">4</span>
                    <button id="inc-extra-every">+</button>
                    <span class="extra-label">giri</span>
                </div>
            </div>
            <div class="row">
                <label>⏳ Durata Extra</label>
                <div class="controls">
                    <button id="dec-extra-dur">−</button>
                    <span id="val-extra-dur">60</span>
                    <button id="inc-extra-dur">+</button>
                </div>
            </div>
            <div class="toggle-row">
                <label>🎵 Tick</label>
                <div class="switch" id="tick-toggle"></div>
            </div>

            <!-- SALVA IN LIBRERIA DIRECTLY FROM DRAWER -->
            <div class="drawer-save-section">
                <input type="text" id="drawer-save-name" placeholder="Nome workout (es. Gambe)" maxlength="25">
                <button id="btn-save-drawer" class="btn-save-drawer">💾 SALVA IN LIBRERIA</button>
            </div>
        </div>

        <!-- PRESET STANDARD -->
        <div id="preset-bar">
            <div class="preset-btn" data-preset="hiit">🔥 HIIT</div>
            <div class="preset-btn" data-preset="tabata">⚡ TABATA</div>
            <div class="preset-btn" data-preset="forza">💪🏼 FORZA</div>
            <div class="preset-btn" data-preset="cardio">🫀 CARDIO</div>
        </div>

        <!-- BOTTONE LIBRERIA -->
        <button id="btn-open-library">📁 Apri Libreria (0)</button>
    </div>

    <!-- MODALE LIBRERIA WORKOUT -->
    <div id="library-modal">
        <div class="modal-header">
            <h2>📁 Libreria Workout</h2>
            <button class="modal-close-btn" id="modal-close">✕</button>
        </div>
        <div class="modal-body">
            <!-- CAMPO DI RICERCA -->
            <div class="search-box">
                <input type="text" id="library-search-input" placeholder="🔍 Cerca per nome...">
            </div>

            <!-- LISTA PRESET PERSONALIZZATI -->
            <div class="library-list" id="library-items-list">
                <!-- Generati via JS -->
            </div>
        </div>
    </div>

    <!-- APP PRINCIPALE -->
    <div id="app">
        <!-- TIMER -->
        <div id="timer-display">
            <div id="rounds-info">Giro 0 / 12</div>
            <div id="big-number">30</div>
            <div id="phase-label">PRONTO</div>
            <svg id="progress-ring-container" viewBox="-6 -6 112 112">
                <circle id="ring-outer-bg" cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="5" />
                <circle id="ring-outer" cx="50" cy="50" r="46" fill="none" stroke="#00f0ff" stroke-width="5"
                    stroke-linecap="round" stroke-dasharray="289.03" stroke-dashoffset="289.03"
                    transform="rotate(-90 50 50)" />
                <circle id="ring-inner-bg" cx="50" cy="50" r="39" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="5" />
                <circle id="ring-inner" cx="50" cy="50" r="39" fill="none" stroke="#38ef7d" stroke-width="5"
                    stroke-linecap="round" stroke-dasharray="245.04" stroke-dashoffset="245.04"
                    transform="rotate(-90 50 50)" />
            </svg>
        </div>

        <!-- PALLINI -->
        <div id="progress-dots-container">
            <div id="progress-dots"></div>
        </div>

        <!-- CONTROLLI -->
        <div id="controls">
            <button id="btn-start" class="ctrl-btn idle">PARTI</button>
            <button id="btn-skip-back" class="ctrl-btn">◀ IND.</button>
            <button id="btn-skip-forward" class="ctrl-btn">▶ AVV.</button>
            <button id="btn-stop" class="ctrl-btn">STOP</button>
            <button id="btn-pause" style="display:none;"></button>
            <button id="btn-skip" style="display:none;"></button>
            <button id="btn-reset" style="display:none;"></button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            "use strict";

            function triggerVibration(pattern) {
                if (navigator.vibrate) navigator.vibrate(pattern);
            }

            // ==============================
            // 1. DRAWER E MODALE LIBRERIA
            // ==============================
            var drawer = document.getElementById('drawer');
            var overlay = document.getElementById('overlay');
            var logoBtn = document.getElementById('logo-header');
            var closeBtn = document.getElementById('drawer-close');
            var libraryModal = document.getElementById('library-modal');
            var btnOpenLibrary = document.getElementById('btn-open-library');
            var modalCloseBtn = document.getElementById('modal-close');

            function openDrawer() {
                drawer.classList.add('open');
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeDrawer() {
                drawer.classList.remove('open');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            function openLibraryModal() {
                renderLibraryItems();
                libraryModal.classList.add('active');
            }

            function closeLibraryModal() {
                libraryModal.classList.remove('active');
            }

            logoBtn.addEventListener('click', openDrawer);
            closeBtn.addEventListener('click', closeDrawer);
            overlay.addEventListener('click', function() {
                closeDrawer();
                closeLibraryModal();
            });

            btnOpenLibrary.addEventListener('click', openLibraryModal);
            modalCloseBtn.addEventListener('click', closeLibraryModal);

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    if (libraryModal.classList.contains('active')) closeLibraryModal();
                    else if (drawer.classList.contains('open')) closeDrawer();
                }
            });

            // ==============================
            // 2. RIFERIMENTI DOM
            // ==============================
            var valWork = document.getElementById('val-work');
            var valRest = document.getElementById('val-rest');
            var valRounds = document.getElementById('val-rounds');
            var valExtraEvery = document.getElementById('val-extra-every');
            var valExtraDur = document.getElementById('val-extra-dur');
            var bigNumber = document.getElementById('big-number');
            var phaseLabel = document.getElementById('phase-label');
            var roundsInfo = document.getElementById('rounds-info');
            var ringInner = document.getElementById('ring-inner');
            var ringOuter = document.getElementById('ring-outer');
            var progressDots = document.getElementById('progress-dots');
            var appDiv = document.getElementById('app');
            var btnStart = document.getElementById('btn-start');
            var btnPause = document.getElementById('btn-pause');
            var btnSkipBack = document.getElementById('btn-skip-back');
            var btnSkipForward = document.getElementById('btn-skip-forward');
            var btnStop = document.getElementById('btn-stop');
            var presetBtns = document.querySelectorAll('#drawer .preset-btn[data-preset]');
            var tickToggle = document.getElementById('tick-toggle');

            // DOM Libreria Modal & Save Drawer
            var libraryItemsList = document.getElementById('library-items-list');
            var drawerSaveName = document.getElementById('drawer-save-name');
            var btnSaveDrawer = document.getElementById('btn-save-drawer');
            var librarySearchInput = document.getElementById('library-search-input');

            var CIRC_OUTER = 289.03;
            var CIRC_INNER = 245.04;

            // PRESETS STANDARD
            var PRESETS = {
                hiit: { work: 30, rest: 15, rounds: 12, extraEvery: 4, extraDur: 60 },
                tabata: { work: 20, rest: 10, rounds: 8, extraEvery: 0, extraDur: 60 },
                forza: { work: 45, rest: 90, rounds: 6, extraEvery: 3, extraDur: 90 },
                cardio: { work: 60, rest: 20, rounds: 10, extraEvery: 5, extraDur: 120 }
            };

            // STATO GLOBALE
            var settings = { work: 30, rest: 15, rounds: 12, extraEvery: 4, extraDur: 60 };
            var tickEnabled = false;
            var tickInterval = null;
            var totalDuration = 0;
            var totalElapsed = 0;
            var lastCountdownSecond = -1;

            var timerState = {
                status: 'idle',
                currentRound: 0,
                totalRounds: settings.rounds,
                currentTime: settings.work,
                maxTime: settings.work,
                timerInterval: null,
                isPaused: false,
                extraTriggeredThisRound: false
            };

            // AUDIO
            var audioCtx = null;
            function initAudio() {
                if (!audioCtx) {
                    try { audioCtx = new(window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
                }
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            }

            function playBeep(freq, duration) {
                freq = freq || 800; duration = duration || 80;
                try {
                    initAudio(); if (!audioCtx) return;
                    var osc = audioCtx.createOscillator();
                    var gain = audioCtx.createGain();
                    osc.type = 'sine'; osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration / 1000);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + duration / 1000);
                } catch (e) {}
            }

            function playCountdownTick(seconds) { playBeep(800, 80); }
            function handleCountdownTick() {
                if (timerState.isPaused) return;
                var seconds = Math.ceil(timerState.currentTime);
                if (seconds >= 1 && seconds <= 3 && seconds !== lastCountdownSecond) {
                    lastCountdownSecond = seconds;
                    playCountdownTick(seconds);
                }
            }
            function playGong() { playBeep(400, 600); }
            function playExtraAlert() {
                playBeep(600, 150);
                setTimeout(function() { playBeep(900, 150); }, 180);
            }
            function playTickMetronome() { playBeep(1200, 30); }

            function calculateTotalDuration() {
                var work = settings.work, rest = settings.rest, rounds = settings.rounds;
                var extraEvery = settings.extraEvery, extraDur = settings.extraDur;
                if (rounds === 0) return 0;
                var total = (work + rest) * rounds;
                if (extraEvery > 0) {
                    var numExtras = Math.floor(rounds / extraEvery);
                    total += extraDur * numExtras;
                }
                total += 3;
                return total;
            }

            // TICK METRONOMO
            function loadTickState() {
                try { tickEnabled = localStorage.getItem('pt_timer_tick') === 'true'; } catch (e) { tickEnabled = false; }
                tickToggle.classList.toggle('active', tickEnabled);
            }
            function saveTickState() {
                try { localStorage.setItem('pt_timer_tick', tickEnabled ? 'true' : 'false'); } catch (e) {}
            }
            tickToggle.addEventListener('click', function() {
                tickEnabled = !tickEnabled;
                this.classList.toggle('active', tickEnabled);
                saveTickState();
                if (timerState.status === 'work' && !timerState.isPaused) startTick();
                else stopTick();
            });
            function startTick() {
                stopTick();
                if (!tickEnabled || timerState.status !== 'work' || timerState.isPaused) return;
                tickInterval = setInterval(function() {
                    if (timerState.status === 'work' && !timerState.isPaused) playTickMetronome();
                    else stopTick();
                }, 1000);
            }
            function stopTick() { if (tickInterval) { clearInterval(tickInterval); tickInterval = null; } }

            // ==============================
            // LIBRERIA PRESET - SALVATAGGIO & CARICAMENTO
            // ==============================
            var libraryPresets = [];

            function loadLibraryPresets() {
                try {
                    var data = localStorage.getItem('pt_timer_library_presets');
                    if (data) libraryPresets = JSON.parse(data);
                    else libraryPresets = [];
                } catch (e) { libraryPresets = []; }
                updateLibraryButtonLabel();
            }

            function saveLibraryPresets() {
                try {
                    localStorage.setItem('pt_timer_library_presets', JSON.stringify(libraryPresets));
                } catch (e) {}
                updateLibraryButtonLabel();
                renderLibraryItems();
            }

            function updateLibraryButtonLabel() {
                btnOpenLibrary.textContent = '📁 Apri Libreria (' + libraryPresets.length + ')';
            }

            function addLibraryPreset(name) {
                if (!name || name.trim() === '') {
                    alert('Inserisci un nome per l\'allenamento!');
                    return;
                }
                var newItem = {
                    id: Date.now(),
                    name: name.trim(),
                    work: parseInt(valWork.textContent, 10) || 30,
                    rest: parseInt(valRest.textContent, 10) || 15,
                    rounds: parseInt(valRounds.textContent, 10) || 12,
                    extraEvery: parseInt(valExtraEvery.textContent, 10) || 0,
                    extraDur: parseInt(valExtraDur.textContent, 10) || 60,
                    date: new Date().toLocaleDateString('it-IT')
                };
                libraryPresets.unshift(newItem);
                saveLibraryPresets();
                drawerSaveName.value = '';
                alert('Workout "' + newItem.name + '" salvato in libreria!');
            }

            function deleteLibraryPreset(id) {
                if (confirm('Sei sicuro di voler eliminare questo workout?')) {
                    libraryPresets = libraryPresets.filter(function(item) { return item.id !== id; });
                    saveLibraryPresets();
                }
            }

            function loadLibraryPresetIntoTimer(id) {
                var found = libraryPresets.find(function(item) { return item.id === id; });
                if (!found) return;

                settings.work = found.work;
                settings.rest = found.rest;
                settings.rounds = found.rounds;
                settings.extraEvery = found.extraEvery;
                settings.extraDur = found.extraDur;

                syncUIFromSettings();
                timerState.totalRounds = settings.rounds;
                timerState.currentRound = 0;
                timerState.currentTime = settings.work;
                timerState.maxTime = settings.work;
                resetUI();
                updateUI();

                presetBtns.forEach(function(b) { b.classList.remove('active'); });
                closeLibraryModal();
                closeDrawer();
            }

            function renderLibraryItems() {
                var query = librarySearchInput.value.toLowerCase().trim();
                libraryItemsList.innerHTML = '';

                var filtered = libraryPresets.filter(function(item) {
                    return item.name.toLowerCase().includes(query);
                });

                if (filtered.length === 0) {
                    libraryItemsList.innerHTML = '<div class="empty-library-msg">' +
                        (query ? 'Nessun allenamento trovato.' : 'Nessun allenamento salvato nella libreria.') +
                        '</div>';
                    return;
                }

                filtered.forEach(function(item) {
                    var card = document.createElement('div');
                    card.className = 'library-item';

                    var info = document.createElement('div');
                    info.className = 'library-item-info';

                    var title = document.createElement('div');
                    title.className = 'library-item-title';
                    title.textContent = item.name;

                    var details = document.createElement('div');
                    details.className = 'library-item-details';
                    details.innerHTML = '⏱ <span>' + item.work + 's</span> / 🧘🏻‍♀️ <span>' + item.rest + 's</span> | 🔁 <span>' + item.rounds + ' giri</span>' +
                        (item.extraEvery > 0 ? ' | 🕝 Extra ogni <span>' + item.extraEvery + '</span>' : '');

                    info.appendChild(title);
                    info.appendChild(details);

                    var actions = document.createElement('div');
                    actions.className = 'library-item-actions';

                    var btnLoad = document.createElement('button');
                    btnLoad.className = 'btn-action-load';
                    btnLoad.textContent = 'CARICA';
                    btnLoad.addEventListener('click', function() { loadLibraryPresetIntoTimer(item.id); });

                    var btnDel = document.createElement('button');
                    btnDel.className = 'btn-action-del';
                    btnDel.textContent = '🗑';
                    btnDel.addEventListener('click', function() { deleteLibraryPreset(item.id); });

                    actions.appendChild(btnLoad);
                    actions.appendChild(btnDel);

                    card.appendChild(info);
                    card.appendChild(actions);

                    libraryItemsList.appendChild(card);
                });
            }

            btnSaveDrawer.addEventListener('click', function() {
                addLibraryPreset(drawerSaveName.value);
            });

            librarySearchInput.addEventListener('input', renderLibraryItems);

            // UPDATE UI
            function updateDots() {
                var total = timerState.totalRounds || 1;
                var done = timerState.currentRound;
                progressDots.innerHTML = '';
                for (var i = 1; i <= total; i++) {
                    var dot = document.createElement('span');
                    dot.className = 'dot';
                    if (i < done) dot.classList.add('done');
                    else if (i === done && timerState.status !== 'idle' && timerState.status !== 'finished') {
                        if (timerState.status === 'extra') dot.classList.add('extra-dot');
                        else dot.classList.add('current');
                    }
                    progressDots.appendChild(dot);
                }
            }

            function updateUI() {
                bigNumber.textContent = Math.ceil(timerState.currentTime);
                roundsInfo.textContent = 'Giro ' + timerState.currentRound + ' / ' + timerState.totalRounds;
                updateDots();

                var progressInner = (timerState.maxTime > 0) ? (timerState.currentTime / timerState.maxTime) * 100 : 0;
                var offsetInner = CIRC_INNER - (progressInner / 100) * CIRC_INNER;
                ringInner.style.strokeDashoffset = offsetInner;

                var color = 'rgba(255,255,255,0.2)';
                var phaseClass = '';
                var isRestWarning = (timerState.status === 'rest' && timerState.currentTime <= 3 && timerState.currentTime > 0);
                if (timerState.status === 'work') { color = 'var(--work-green)'; phaseClass = 'phase-work'; }
                else if (timerState.status === 'rest') {
                    if (isRestWarning) { color = 'var(--warning-yellow)'; phaseClass = 'phase-rest-warning'; }
                    else { color = 'var(--rest-red)'; phaseClass = 'phase-rest'; }
                } else if (timerState.status === 'extra') { color = 'var(--extra-blue)'; phaseClass = 'phase-extra'; }
                else if (timerState.status === 'countdown') { color = 'var(--primary-cyan)'; phaseClass = 'phase-countdown'; }
                else if (timerState.status === 'finished') { color = 'var(--work-green)'; phaseClass = 'phase-finished'; }

                ringInner.style.stroke = color;
                appDiv.classList.remove('phase-work', 'phase-rest', 'phase-rest-warning', 'phase-extra', 'phase-countdown', 'phase-finished');
                if (phaseClass) appDiv.classList.add(phaseClass);

                if (totalDuration > 0) {
                    var progressOuter = (totalElapsed / totalDuration) * 100;
                    if (progressOuter > 100) progressOuter = 100;
                    var offsetOuter = CIRC_OUTER - (progressOuter / 100) * CIRC_OUTER;
                    ringOuter.style.strokeDashoffset = offsetOuter;
                } else {
                    ringOuter.style.strokeDashoffset = CIRC_OUTER;
                }
            }

            function resetUI() {
                bigNumber.textContent = settings.work;
                roundsInfo.textContent = 'Giro 0 / ' + settings.rounds;
                phaseLabel.textContent = 'PRONTO';
                appDiv.classList.remove('phase-work', 'phase-rest', 'phase-rest-warning', 'phase-extra', 'phase-countdown', 'phase-finished');
                ringInner.style.strokeDashoffset = CIRC_INNER;
                ringInner.style.stroke = 'rgba(255,255,255,0.2)';
                ringOuter.style.strokeDashoffset = CIRC_OUTER;
                btnStart.style.display = 'flex';
                btnStart.textContent = 'PARTI';
                btnStart.className = 'ctrl-btn idle';
                btnPause.style.display = 'none';
                btnSkipBack.style.display = 'none';
                btnSkipForward.style.display = 'none';
                btnStop.style.display = 'none';
                timerState.currentRound = 0;
                timerState.totalRounds = settings.rounds;
                totalElapsed = 0;
                lastCountdownSecond = -1;
                updateDots();
                stopTick();
            }

            // TIMER ENGINE
            function stopTimer() {
                if (timerState.timerInterval) {
                    clearInterval(timerState.timerInterval);
                    timerState.timerInterval = null;
                }
                stopTick();
            }

            function startCountdownInterval() {
                stopTimer(); lastCountdownSecond = -1;
                timerState.timerInterval = setInterval(function() {
                    if (timerState.isPaused) return;
                    timerState.currentTime -= 0.1; totalElapsed += 0.1;
                    handleCountdownTick();
                    if (timerState.currentTime <= 0) {
                        timerState.currentTime = 0; updateUI();
                        setTimeout(function() { playBeep(1200, 80); }, 100);
                        startWorkPhase(); return;
                    }
                    updateUI();
                }, 100);
            }

            function startWorkInterval() {
                stopTimer(); lastCountdownSecond = -1;
                timerState.timerInterval = setInterval(function() {
                    if (timerState.isPaused) return;
                    timerState.currentTime -= 0.1; totalElapsed += 0.1;
                    handleCountdownTick();
                    if (timerState.currentTime <= 0) {
                        timerState.currentTime = 0; updateUI();
                        playGong(); triggerVibration([300, 100, 300]);
                        if (timerState.currentRound >= timerState.totalRounds) finishWorkout();
                        else startRestPhase();
                        return;
                    }
                    updateUI();
                }, 100);
                if (tickEnabled) startTick();
            }

            function startRestInterval() {
                stopTimer(); lastCountdownSecond = -1;
                timerState.timerInterval = setInterval(function() {
                    if (timerState.isPaused) return;
                    timerState.currentTime -= 0.1; totalElapsed += 0.1;
                    handleCountdownTick();
                    if (timerState.currentTime <= 0) {
                        timerState.currentTime = 0; updateUI();
                        playBeep(1200, 80); triggerVibration([200, 100, 200]);
                        var shouldTriggerExtra = (settings.extraEvery > 0) &&
                            (timerState.currentRound % settings.extraEvery === 0) &&
                            !timerState.extraTriggeredThisRound &&
                            (timerState.currentRound < timerState.totalRounds);
                        if (shouldTriggerExtra) {
                            timerState.extraTriggeredThisRound = true;
                            startExtraPhase();
                        } else startWorkPhase();
                        return;
                    }
                    updateUI();
                }, 100);
            }

            function startExtraInterval() {
                stopTimer(); lastCountdownSecond = -1;
                timerState.timerInterval = setInterval(function() {
                    if (timerState.isPaused) return;
                    timerState.currentTime -= 0.1; totalElapsed += 0.1;
                    handleCountdownTick();
                    if (timerState.currentTime <= 0) {
                        timerState.currentTime = 0; updateUI();
                        playBeep(1000, 400); triggerVibration([300]);
                        startWorkPhase(); return;
                    }
                    updateUI();
                }, 100);
            }

            // FASI
            function startCountdown() {
                stopTimer(); triggerVibration([100, 100, 100]);
                timerState.status = 'countdown'; timerState.currentTime = 3; timerState.maxTime = 3;
                timerState.isPaused = false; phaseLabel.textContent = 'PARTENZA';
                btnSkipBack.style.display = 'none'; btnSkipForward.style.display = 'none'; btnStop.style.display = 'none';
                updateUI(); startCountdownInterval();
            }

            function startWorkPhase() {
                stopTimer(); triggerVibration([200]);
                timerState.status = 'work'; timerState.currentRound += 1;
                timerState.currentTime = settings.work; timerState.maxTime = settings.work;
                timerState.isPaused = false; timerState.extraTriggeredThisRound = false;
                phaseLabel.textContent = 'LAVORO';
                btnSkipBack.style.display = 'flex'; btnSkipBack.textContent = '◀ IND.';
                btnSkipForward.style.display = 'flex'; btnSkipForward.textContent = '▶ AVV.';
                btnStop.style.display = 'flex';
                updateUI(); startWorkInterval();
            }

            function startRestPhase() {
                stopTimer(); triggerVibration([100]);
                timerState.status = 'rest'; timerState.currentTime = settings.rest; timerState.maxTime = settings.rest;
                timerState.isPaused = false; phaseLabel.textContent = 'RECUPERO';
                btnSkipBack.style.display = 'flex'; btnSkipBack.textContent = '◀ IND.';
                btnSkipForward.style.display = 'flex'; btnSkipForward.textContent = '▶ AVV.';
                btnStop.style.display = 'flex';
                updateUI(); stopTick(); startRestInterval();
            }

            function startExtraPhase() {
                stopTimer(); triggerVibration([100, 50, 100]);
                timerState.status = 'extra'; timerState.currentTime = settings.extraDur; timerState.maxTime = settings.extraDur;
                timerState.isPaused = false; phaseLabel.textContent = 'EXTRA ATTIVO';
                btnSkipBack.style.display = 'flex'; btnSkipBack.textContent = '◀ IND.';
                btnSkipForward.style.display = 'flex'; btnSkipForward.textContent = '▶ AVV.';
                btnStop.style.display = 'flex';
                updateUI(); playExtraAlert(); stopTick(); startExtraInterval();
            }

            function finishWorkout() {
                stopTimer(); triggerVibration([100, 50, 100, 50, 300]);
                timerState.status = 'finished'; timerState.currentTime = 0;
                phaseLabel.textContent = 'COMPLETATO'; bigNumber.textContent = '0';
                roundsInfo.textContent = 'Giro ' + timerState.currentRound + ' / ' + timerState.totalRounds;
                ringInner.style.strokeDashoffset = 0; ringInner.style.stroke = 'var(--work-green)';
                ringOuter.style.strokeDashoffset = 0;
                if (totalDuration > 0) totalElapsed = totalDuration;
                appDiv.classList.add('phase-finished');
                btnStart.style.display = 'flex'; btnStart.textContent = 'RIAVVIA'; btnStart.className = 'ctrl-btn idle';
                btnPause.style.display = 'none'; btnSkipBack.style.display = 'none'; btnSkipForward.style.display = 'none'; btnStop.style.display = 'none';
                updateDots(); stopTick();
                setTimeout(function() { playBeep(523, 200); }, 100);
                setTimeout(function() { playBeep(659, 200); }, 300);
                setTimeout(function() { playBeep(784, 400); }, 500);
            }

            // CONTROLLI
            function skipBack() {
                if (timerState.status === 'idle' || timerState.status === 'finished' || timerState.isPaused) return;
                var s = timerState.status;
                if (s === 'work') {
                    if (timerState.currentRound > 1) {
                        timerState.currentRound -= 1; timerState.status = 'rest';
                        timerState.currentTime = settings.rest; timerState.maxTime = settings.rest;
                        timerState.extraTriggeredThisRound = false;
                        phaseLabel.textContent = 'RECUPERO';
                        updateUI(); triggerVibration([100]); stopTick(); startRestInterval();
                    }
                } else if (s === 'rest' || s === 'extra') {
                    timerState.status = 'work'; timerState.currentTime = settings.work; timerState.maxTime = settings.work;
                    phaseLabel.textContent = 'LAVORO'; updateUI(); triggerVibration([200]); startWorkInterval();
                }
            }

            function skipForward() {
                if (timerState.status === 'idle' || timerState.status === 'finished' || timerState.isPaused) return;
                var remaining = timerState.currentTime;
                if (remaining > 0) totalElapsed += remaining;
                stopTimer(); stopTick();
                var s = timerState.status;
                if (s === 'countdown') {
                    playBeep(1200, 80);
                    triggerVibration([200]);
                    startWorkPhase();
                } else if (s === 'work') {
                    playGong(); triggerVibration([200]);
                    if (timerState.currentRound >= timerState.totalRounds) finishWorkout();
                    else {
                        var shouldTriggerExtra = (settings.extraEvery > 0) &&
                            (timerState.currentRound % settings.extraEvery === 0) &&
                            !timerState.extraTriggeredThisRound &&
                            (timerState.currentRound < timerState.totalRounds);
                        if (shouldTriggerExtra) { timerState.extraTriggeredThisRound = true; startExtraPhase(); }
                        else startRestPhase();
                    }
                } else if (s === 'rest') {
                    playBeep(1200, 80); triggerVibration([100]); startWorkPhase();
                } else if (s === 'extra') {
                    playBeep(1000, 200); triggerVibration([100]); startWorkPhase();
                }
                updateUI();
            }

            function stopAll() {
                stopTimer(); stopTick();
                timerState.status = 'idle'; timerState.currentRound = 0; timerState.isPaused = false;
                timerState.extraTriggeredThisRound = false; timerState.currentTime = settings.work;
                timerState.maxTime = settings.work; timerState.totalRounds = settings.rounds;
                totalElapsed = 0; lastCountdownSecond = -1;
                syncUIFromSettings(); resetUI(); updateUI();
            }

            function togglePause() {
                if (timerState.status === 'idle' || timerState.status === 'finished') return;
                if (timerState.isPaused) {
                    timerState.isPaused = false; btnStart.textContent = 'PAUSA'; btnStart.className = 'ctrl-btn running';
                    var s = timerState.status;
                    if (s === 'work') startWorkInterval();
                    else if (s === 'rest') startRestInterval();
                    else if (s === 'extra') startExtraInterval();
                    else if (s === 'countdown') startCountdownInterval();
                } else {
                    timerState.isPaused = true; btnStart.textContent = 'RIPRENDI'; btnStart.className = 'ctrl-btn idle';
                    stopTimer(); stopTick(); updateUI();
                }
            }

            function syncUIFromSettings() {
                valWork.textContent = settings.work; valRest.textContent = settings.rest;
                valRounds.textContent = settings.rounds; valExtraEvery.textContent = settings.extraEvery;
                valExtraDur.textContent = settings.extraDur;
            }

            function loadSettingsIntoState() {
                settings.work = parseInt(valWork.textContent, 10) || 30;
                settings.rest = parseInt(valRest.textContent, 10) || 15;
                settings.rounds = parseInt(valRounds.textContent, 10) || 8;
                settings.extraEvery = parseInt(valExtraEvery.textContent, 10) || 0;
                settings.extraDur = parseInt(valExtraDur.textContent, 10) || 60;
                timerState.totalRounds = settings.rounds;
                if (timerState.status === 'idle' || timerState.status === 'finished') {
                    timerState.currentTime = settings.work; timerState.maxTime = settings.work;
                    bigNumber.textContent = settings.work; roundsInfo.textContent = 'Giro 0 / ' + settings.rounds;
                    ringInner.style.strokeDashoffset = CIRC_INNER; ringInner.style.stroke = 'rgba(255,255,255,0.2)';
                    ringOuter.style.strokeDashoffset = CIRC_OUTER; phaseLabel.textContent = 'PRONTO';
                    appDiv.classList.remove('phase-work', 'phase-rest', 'phase-rest-warning', 'phase-extra', 'phase-countdown', 'phase-finished');
                    updateDots();
                }
            }

            function loadPreset(name) {
                if (timerState.status !== 'idle' && timerState.status !== 'finished') return;
                var preset = PRESETS[name]; if (!preset) return;
                settings.work = preset.work; settings.rest = preset.rest;
                settings.rounds = preset.rounds; settings.extraEvery = preset.extraEvery;
                settings.extraDur = preset.extraDur;
                syncUIFromSettings();
                timerState.totalRounds = settings.rounds; timerState.currentRound = 0;
                timerState.currentTime = settings.work; timerState.maxTime = settings.work;
                totalElapsed = 0; resetUI(); updateUI();
                presetBtns.forEach(function(b) { b.classList.remove('active'); });
                var target = document.querySelector('#drawer .preset-btn[data-preset="' + name + '"]');
                if (target) target.classList.add('active');
            }

            function handleStart() {
                initAudio();
                if (timerState.status === 'idle' || timerState.status === 'finished') {
                    loadSettingsIntoState();
                    totalDuration = calculateTotalDuration();
                    if (totalDuration <= 0) totalDuration = 1;
                    totalElapsed = 0; timerState.currentRound = 0; timerState.extraTriggeredThisRound = false;
                    timerState.currentTime = settings.work; timerState.maxTime = settings.work;
                    btnStart.textContent = 'PAUSA'; btnStart.className = 'ctrl-btn running';
                    btnSkipBack.style.display = 'none'; btnSkipForward.style.display = 'none'; btnStop.style.display = 'none';
                    startCountdown();
                } else togglePause();
            }

            function isRunning() { return timerState.status !== 'idle' && timerState.status !== 'finished'; }

            function adjustValue(el, delta, min, max) {
                if (isRunning()) return;
                var val = parseInt(el.textContent, 10) + delta;
                if (val < min) val = min; if (val > max) val = max;
                el.textContent = val;
                if (timerState.status === 'idle' || timerState.status === 'finished') {
                    loadSettingsIntoState(); resetUI(); updateUI();
                }
            }

            // EVENTI CONTROLLI IMPOSTAZIONI
            document.getElementById('dec-work').addEventListener('click', function() { adjustValue(valWork, -1, 3, 300); });
            document.getElementById('inc-work').addEventListener('click', function() { adjustValue(valWork, 1, 3, 300); });
            document.getElementById('dec-rest').addEventListener('click', function() { adjustValue(valRest, -1, 1, 300); });
            document.getElementById('inc-rest').addEventListener('click', function() { adjustValue(valRest, 1, 1, 300); });
            document.getElementById('dec-rounds').addEventListener('click', function() { adjustValue(valRounds, -1, 1, 99); });
            document.getElementById('inc-rounds').addEventListener('click', function() { adjustValue(valRounds, 1, 1, 99); });
            document.getElementById('dec-extra-every').addEventListener('click', function() { adjustValue(valExtraEvery, -1, 0, 99); });
            document.getElementById('inc-extra-every').addEventListener('click', function() { adjustValue(valExtraEvery, 1, 0, 99); });
            document.getElementById('dec-extra-dur').addEventListener('click', function() { adjustValue(valExtraDur, -1, 5, 600); });
            document.getElementById('inc-extra-dur').addEventListener('click', function() { adjustValue(valExtraDur, 1, 5, 600); });

            presetBtns.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    loadPreset(btn.getAttribute('data-preset'));
                });
            });

            btnStart.addEventListener('click', handleStart);
            btnSkipBack.addEventListener('click', skipBack);
            btnSkipForward.addEventListener('click', skipForward);
            btnStop.addEventListener('click', stopAll);

            // WAKE LOCK
            if ('wakeLock' in navigator) {
                var wl = null;
                var reqLock = function() {
                    try { navigator.wakeLock.request('screen').then(function(lock) { wl = lock; }).catch(function() {}); } catch (e) {}
                };
                reqLock();
                document.addEventListener('visibilitychange', function() {
                    if (document.visibilityState === 'visible' && wl === null) reqLock();
                });
            }

            // INIT
            loadTickState();
            loadLibraryPresets();
            loadPreset('hiit');
        });
    </script>
</body>
</html>
