<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050b14">
    <title>KrioPlanet Timer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ==================== PALETTE KRIOPLANET & RESET ==================== */
        :root {
            --bg-dark: #050b14;
            --bg-card: rgba(15, 30, 46, 0.75);
            --primary-cyan: #00f0ff;
            --primary-blue: #0072ff;
            --glow-cyan: rgba(0, 240, 255, 0.35);
            --work-green: #38ef7d;
            --rest-red: #ff4d6d;
            --warning-yellow: #ffc107;
            --extra-blue: #00b4d8;
            --text-main: #ffffff;
            --text-muted: #8a99ad;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background: radial-gradient(circle at 50% 20%, #0d1e30 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            font-family: 'Poppins', -apple-system, 'Helvetica Neue', sans-serif;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        #app {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100dvh;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 16px 20px 16px;
            background: transparent;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }

        /* ==================== LOGO HEADER ==================== */
        #logo-header {
            position: fixed;
            top: 12px;
            left: 16px;
            z-index: 1000;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 30, 46, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 6px 14px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), 0 0 10px var(--glow-cyan);
            transition: all 0.2s ease;
            text-decoration: none;
        }
        #logo-header:active {
            transform: scale(0.95);
        }
        #logo-header img {
            height: 32px;
            width: auto;
            display: block;
            filter: brightness(0) invert(1) drop-shadow(0 0 4px var(--primary-cyan));
            transition: filter 0.3s ease;
        }
        #logo-header .brand-name {
            font-size: 1rem;
            font-weight: 700;
            background: linear-gradient(45deg, #fff, var(--primary-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        /* ==================== DRAWER ==================== */
        #drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: 340px;
            max-width: 85vw;
            height: 100%;
            background: rgba(10, 20, 32, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid rgba(0, 240, 255, 0.2);
            z-index: 1100;
            transform: translateX(-100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            padding: 24px 20px 30px 20px;
            box-shadow: 10px 0 30px rgba(0,0,0,0.8);
            color: var(--text-main);
        }
        #drawer.open {
            transform: translateX(0);
        }

        #drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
        }
        #drawer-header .logo-large {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #drawer-header .logo-large img {
            height: 38px;
            width: auto;
            filter: brightness(0) invert(1) drop-shadow(0 0 4px var(--primary-cyan));
        }
        #drawer-header .logo-large span {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(45deg, #fff, var(--primary-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        #drawer-close {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 1.2rem;
            color: var(--primary-cyan);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        #drawer-close:active {
            transform: scale(0.85);
        }

        /* ==================== OVERLAY ==================== */
        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 1050;
            display: none;
            transition: opacity 0.3s ease;
            opacity: 0;
        }
        #overlay.active {
            display: block;
            opacity: 1;
        }

        /* ==================== IMPOSTAZIONI DENTRO IL DRAWER ==================== */
        #drawer .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            border-radius: 50px;
            margin-bottom: 8px;
        }
        #drawer .row label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-main);
            min-width: 50px;
        }
        #drawer .row .controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #drawer .row .controls button {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--primary-cyan);
            color: var(--primary-cyan);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.15s ease;
        }
        #drawer .row .controls button:active {
            background: var(--primary-cyan);
            color: #000;
            transform: scale(0.9);
        }
        #drawer .row .controls span {
            font-size: 1.05rem;
            font-weight: 700;
            min-width: 30px;
            text-align: center;
            color: var(--primary-cyan);
        }
        #drawer .extra-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            min-width: 25px;
        }

        #drawer .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            border-radius: 50px;
            margin-bottom: 8px;
        }
        #drawer .toggle-row label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #drawer .switch {
            position: relative;
            width: 44px;
            height: 24px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 22px;
            cursor: pointer;
            transition: background 0.3s;
            touch-action: manipulation;
            flex-shrink: 0;
        }
        #drawer .switch.active {
            background: linear-gradient(90deg, var(--primary-cyan), var(--primary-blue));
            box-shadow: 0 0 10px var(--glow-cyan);
        }
        #drawer .switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #drawer .switch.active::after {
            transform: translateX(20px);
        }

        #drawer #preset-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 16px 0 10px 0;
        }
        #drawer .preset-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            padding: 6px 0;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            min-width: 60px;
        }
        #drawer .preset-btn:active {
            transform: scale(0.95);
        }
        #drawer .preset-btn.active {
            border-color: var(--primary-cyan);
            color: #000;
            background: var(--primary-cyan);
            box-shadow: 0 0 12px var(--glow-cyan);
        }
        #drawer .preset-btn.save-btn {
            border-color: var(--primary-cyan);
            color: var(--primary-cyan);
            background: rgba(0, 240, 255, 0.1);
        }
        #drawer .preset-btn.custom-btn {
            border-color: rgba(0, 240, 255, 0.3);
            color: var(--primary-cyan);
            background: rgba(0, 240, 255, 0.05);
        }

        #drawer #custom-presets-section {
            margin-top: 10px;
        }
        #drawer #custom-presets-section .label-custom {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        #drawer .custom-preset-wrapper {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
            min-width: 60px;
            margin-bottom: 6px;
        }
        #drawer .custom-preset-wrapper .preset-btn {
            flex: 1;
        }
        #drawer .custom-preset-wrapper .delete-btn {
            flex: 0.2;
            min-width: 24px;
            font-size: 0.65rem;
            background: rgba(255, 77, 109, 0.15);
            border: 1px solid var(--rest-red);
            color: var(--rest-red);
            border-radius: 30px;
            text-align: center;
            cursor: pointer;
            touch-action: manipulation;
            padding: 6px 0;
            transition: 0.15s ease;
        }
        #drawer .custom-preset-wrapper .delete-btn:active {
            background: var(--rest-red);
            color: white;
            transform: scale(0.95);
        }

        #drawer #new-preset-area {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
            margin-top: 8px;
        }
        #drawer #new-preset-area input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 6px 14px;
            color: #fff;
            font-size: 0.75rem;
            outline: none;
            min-width: 60px;
        }
        #drawer #new-preset-area input::placeholder {
            color: var(--text-muted);
        }
        #drawer #new-preset-area input:focus {
            border-color: var(--primary-cyan);
            box-shadow: 0 0 8px var(--glow-cyan);
        }
        #drawer #new-preset-area .preset-btn {
            flex: 0.4;
            min-width: 50px;
            font-size: 0.7rem;
            padding: 6px 0;
        }

        /* ==================== TIMER DISPLAY (OPTIMIZED MOBILE) ==================== */
        #timer-display {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
            margin: auto 0;
            padding: 20px 0;
        }

        #rounds-info {
            font-size: clamp(0.75rem, 3vw, 1.2rem);
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 2px;
            z-index: 2;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        #big-number {
            position: relative;
            font-size: clamp(3.2rem, 20vw, 9.5rem);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            transition: color 0.2s ease, text-shadow 0.2s ease;
            color: var(--text-main);
            letter-spacing: -1px;
            z-index: 2;
            text-align: center;
            width: 100%;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }

        #phase-label {
            font-size: clamp(0.8rem, 3.5vw, 1.4rem);
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text-muted);
            transition: color 0.2s ease, text-shadow 0.2s ease;
            text-align: center;
            padding: 0 10px;
            z-index: 2;
            margin-top: 2px;
        }

        #progress-ring-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(280px, 82vw, 520px);
            height: clamp(280px, 82vw, 520px);
            pointer-events: none;
            z-index: 0;
            overflow: visible;
            filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.35));
        }
        
        #ring-outer-bg,
        #ring-outer,
        #ring-inner-bg,
        #ring-inner {
            transition: stroke-dashoffset 0.15s linear, stroke 0.3s ease;
        }

        /* PALLINI DI AVANZAMENTO */
        #progress-dots-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px 0;
            flex-shrink: 0;
            min-height: 24px;
        }
        #progress-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            max-width: 85%;
        }
        .dot {
            width: clamp(7px, 1.5vw, 11px);
            height: clamp(7px, 1.5vw, 11px);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        .dot.done {
            background: var(--work-green);
            box-shadow: 0 0 8px rgba(56, 239, 125, 0.5);
        }
        .dot.current {
            background: var(--warning-yellow);
            box-shadow: 0 0 8px rgba(255, 193, 7, 0.6);
            transform: scale(1.2);
        }
        .dot.extra-dot {
            background: var(--extra-blue);
            box-shadow: 0 0 8px rgba(0, 180, 216, 0.6);
            transform: scale(1.2);
        }

        /* ==================== CONTROLLI ==================== */
        #controls {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 8px 0 16px 0;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .ctrl-btn {
            height: 52px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            font-size: clamp(0.85rem, 1.8vw, 1rem);
            font-weight: 700;
            padding: 0 18px;
            min-width: 60px;
            flex: 1;
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            letter-spacing: 1.5px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
            backdrop-filter: blur(8px);
        }
        .ctrl-btn:active {
            transform: scale(0.95);
        }
        #btn-start {
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-blue));
            color: #000;
            border: none;
            box-shadow: 0 4px 20px var(--glow-cyan);
        }
        #btn-start.idle {
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-blue));
            color: #000;
        }
        #btn-start.running {
            background: linear-gradient(135deg, var(--warning-yellow), #f39c12);
            color: #000;
            box-shadow: 0 4px 20px rgba(255, 193, 7, 0.4);
        }
        #btn-skip-back, #btn-skip-forward {
            background: rgba(0, 240, 255, 0.1);
            border-color: rgba(0, 240, 255, 0.3);
            color: var(--primary-cyan);
            display: none;
            flex: 0.6;
            min-width: 50px;
        }
        #btn-skip-back:hover, #btn-skip-forward:hover {
            background: rgba(0, 240, 255, 0.2);
        }
        #btn-stop {
            background: rgba(255, 77, 109, 0.15);
            border-color: rgba(255, 77, 109, 0.4);
            color: var(--rest-red);
            display: none;
            flex: 0.5;
            min-width: 45px;
        }

        /* Hide Legacy Buttons */
        #btn-pause, #btn-skip, #btn-reset {
            display: none !important;
        }

        /* ==================== COLORI DINAMICI FASI ==================== */
        .phase-work #big-number,
        .phase-work #phase-label {
            color: var(--work-green);
            text-shadow: 0 0 25px rgba(56, 239, 125, 0.4);
        }
        .phase-rest #big-number,
        .phase-rest #phase-label {
            color: var(--rest-red);
            text-shadow: 0 0 25px rgba(255, 77, 109, 0.4);
        }
        .phase-rest-warning #big-number,
        .phase-rest-warning #phase-label {
            color: var(--warning-yellow);
            text-shadow: 0 0 25px rgba(255, 193, 7, 0.5);
        }
        .phase-extra #big-number,
        .phase-extra #phase-label {
            color: var(--extra-blue);
            text-shadow: 0 0 25px rgba(0, 180, 216, 0.5);
        }
        .phase-countdown #big-number,
        .phase-countdown #phase-label {
            color: var(--primary-cyan);
            text-shadow: 0 0 25px var(--glow-cyan);
        }
        .phase-finished #big-number,
        .phase-finished #phase-label {
            color: var(--work-green);
            text-shadow: 0 0 30px rgba(56, 239, 125, 0.6);
        }

        /* ==================== MEDIA QUERIES PER DEVICE PICCOLI ==================== */
        @media (max-height: 680px) {
            #app { padding-top: 50px; }
            #big-number { font-size: clamp(2.8rem, 16vw, 6rem); }
            #progress-ring-container { width: clamp(220px, 72vw, 360px); height: clamp(220px, 72vw, 360px); }
            .ctrl-btn { height: 44px; }
        }
    </style>
</head>
<body>

    <!-- ==================== LOGO HEADER ==================== -->
    <button id="logo-header" aria-label="Apri menu KrioPlanet">
        <img src="Logo-Blu.svg" alt="KrioPlanet" id="logo-img">
        <span class="brand-name">KRIOPLANET</span>
    </button>

    <!-- ==================== OVERLAY ==================== -->
    <div id="overlay"></div>

    <!-- ==================== DRAWER ==================== -->
    <div id="drawer">
        <div id="drawer-header">
            <div class="logo-large">
                <img src="Logo-Blu.svg" alt="KrioPlanet">
                <span>KRIOPLANET</span>
            </div>
            <button id="drawer-close" aria-label="Chiudi menu">✕</button>
        </div>
        <!-- ===== IMPOSTAZIONI ===== -->
        <div id="setup-inside-drawer">
            <div class="row">
                <label>⏱ Lavoro</label>
                <div class="controls">
                    <button id="dec-work">−</button>
                    <span id="val-work">30</span>
                    <button id="inc-work">+</button>
                </div>
            </div>
            <div class="row">
                <label>🧘🏻‍♀️ Recupero</label>
                <div class="controls">
                    <button id="dec-rest">−</button>
                    <span id="val-rest">15</span>
                    <button id="inc-rest">+</button>
                </div>
            </div>
            <div class="row">
                <label>🔁 Giri</label>
                <div class="controls">
                    <button id="dec-rounds">−</button>
                    <span id="val-rounds">12</span>
                    <button id="inc-rounds">+</button>
                </div>
            </div>
            <div class="row">
                <label>🕝 Extra ogni</label>
                <div class="controls">
                    <button id="dec-extra-every">−</button>
                    <span id="val-extra-every">4</span>
                    <button id="inc-extra-every">+</button>
                    <span class="extra-label">giri</span>
                </div>
            </div>
            <div class="row">
                <label>⏳ Durata Extra</label>
                <div class="controls">
                    <button id="dec-extra-dur">−</button>
                    <span id="val-extra-dur">60</span>
                    <button id="inc-extra-dur">+</button>
                </div>
            </div>
            <div class="toggle-row">
                <label>🎵 Tick</label>
                <div class="switch" id="tick-toggle"></div>
            </div>
        </div>

        <!-- ===== PRESET STANDARD ===== -->
        <div id="preset-bar">
            <div class="preset-btn" data-preset="hiit">🔥 HIIT</div>
            <div class="preset-btn" data-preset="tabata">⚡ TABATA</div>
            <div class="preset-btn" data-preset="forza">💪🏼 FORZA</div>
            <div class="preset-btn" data-preset="cardio">🫀 CARDIO</div>
        </div>

        <!-- ===== PRESET PERSONALIZZATI ===== -->
        <div id="custom-presets-section">
            <div class="label-custom">📁 I MIEI PRESET</div>
            <div id="custom-presets-list" style="display: flex; flex-wrap: wrap; gap: 4px; width: 100%;"></div>
            <div id="new-preset-area">
                <input type="text" id="new-preset-name" placeholder="Nome..." maxlength="20">
                <button class="preset-btn save-btn" id="btn-add-custom">➕ NUOVO</button>
            </div>
        </div>
    </div>

    <!-- ==================== APP PRINCIPALE ==================== -->
    <div id="app">
        <!-- TIMER -->
        <div id="timer-display">
            <div id="rounds-info">Giro 0 / 12</div>
            <div id="big-number">30</div>
            <div id="phase-label">PRONTO</div>
            <svg id="progress-ring-container" viewBox="-6 -6 112 112">
                <circle id="ring-outer-bg" cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="5" />
                <circle id="ring-outer" cx="50" cy="50" r="46" fill="none" stroke="#00f0ff" stroke-width="5"
                    stroke-linecap="round" stroke-dasharray="289.03" stroke-dashoffset="289.03"
                    transform="rotate(-90 50 50)" />
                <circle id="ring-inner-bg" cx="50" cy="50" r="39" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="5" />
                <circle id="ring-inner" cx="50" cy="50" r="39" fill="none" stroke="#38ef7d" stroke-width="5"
                    stroke-linecap="round" stroke-dasharray="245.04" stroke-dashoffset="245.04"
                    transform="rotate(-90 50 50)" />
            </svg>
        </div>

        <!-- PALLINI -->
        <div id="progress-dots-container">
            <div id="progress-dots"></div>
        </div>

        <!-- CONTROLLI -->
        <div id="controls">
            <button id="btn-start" class="ctrl-btn idle">PARTI</button>
            <button id="btn-skip-back" class="ctrl-btn">◀ IND.</button>
            <button id="btn-skip-forward" class="ctrl-btn">▶ AVV.</button>
            <button id="btn-stop" class="ctrl-btn">STOP</button>
            <button id="btn-pause" style="display:none;"></button>
            <button id="btn-skip" style="display:none;"></button>
            <button id="btn-reset" style="display:none;"></button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            "use strict";

            // VIBRAZIONE APTICA PER FEEDBACK CONTINUO
            function triggerVibration(pattern) {
                if (navigator.vibrate) {
                    navigator.vibrate(pattern);
                }
            }

            // ==============================
            // 1. DRAWER
            // ==============================
            var drawer = document.getElementById('drawer');
            var overlay = document.getElementById('overlay');
            var logoBtn = document.getElementById('logo-header');
            var closeBtn = document.getElementById('drawer-close');

            function openDrawer() {
                drawer.classList.add('open');
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeDrawer() {
                drawer.classList.remove('open');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            logoBtn.addEventListener('click', openDrawer);
            closeBtn.addEventListener('click', closeDrawer);
            overlay.addEventListener('click', closeDrawer);

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && drawer.classList.contains('open')) {
                    closeDrawer();
                }
            });

            // ==============================
            // 2. RIFERIMENTI DOM
            // ==============================
            var valWork = document.getElementById('val-work');
            var valRest = document.getElementById('val-rest');
            var valRounds = document.getElementById('val-rounds');
            var valExtraEvery = document.getElementById('val-extra-every');
            var valExtraDur = document.getElementById('val-extra-dur');
            var bigNumber = document.getElementById('big-number');
            var phaseLabel = document.getElementById('phase-label');
            var roundsInfo = document.getElementById('rounds-info');
            var ringInner = document.getElementById('ring-inner');
            var ringOuter = document.getElementById('ring-outer');
            var progressDots = document.getElementById('progress-dots');
            var appDiv = document.getElementById('app');
            var btnStart = document.getElementById('btn-start');
            var btnPause = document.getElementById('btn-pause');
            var btnSkipBack = document.getElementById('btn-skip-back');
            var btnSkipForward = document.getElementById('btn-skip-forward');
            var btnStop = document.getElementById('btn-stop');
            var presetBtns = document.querySelectorAll('#drawer .preset-btn[data-preset]');
            var tickToggle = document.getElementById('tick-toggle');
            var customList = document.getElementById('custom-presets-list');
            var newPresetName = document.getElementById('new-preset-name');
            var btnAddCustom = document.getElementById('btn-add-custom');

            var CIRC_OUTER = 289.03;
            var CIRC_INNER = 245.04;

            // ==============================
            // 3. PRESETS
            // ==============================
            var PRESETS = {
                hiit: { work: 30, rest: 15, rounds: 12, extraEvery: 4, extraDur: 60 },
                tabata: { work: 20, rest: 10, rounds: 8, extraEvery: 0, extraDur: 60 },
                forza: { work: 45, rest: 90, rounds: 6, extraEvery: 3, extraDur: 90 },
                cardio: { work: 60, rest: 20, rounds: 10, extraEvery: 5, extraDur: 120 }
            };

            // ==============================
            // 4. STATO GLOBALE
            // ==============================
            var settings = { work: 30, rest: 15, rounds: 12, extraEvery: 4, extraDur: 60 };
            var tickEnabled = false;
            var tickInterval = null;
            var totalDuration = 0;
            var totalElapsed = 0;
            var lastCountdownSecond = -1;

            var timerState = {
                status: 'idle',
                currentRound: 0,
                totalRounds: settings.rounds,
                currentTime: settings.work,
                maxTime: settings.work,
                timerInterval: null,
                isPaused: false,
                extraTriggeredThisRound: false
            };

            // ==============================
            // 5. AUDIO
            // ==============================
            var audioCtx = null;

            function initAudio() {
                if (!audioCtx) {
                    try { audioCtx = new(window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
                }
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            }

            function playBeep(freq, duration) {
                freq = freq || 800;
                duration = duration || 80;
                try {
                    initAudio();
                    if (!audioCtx) return;
                    var osc = audioCtx.createOscillator();
                    var gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration / 1000);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + duration / 1000);
                } catch (e) {}
            }

            function playCountdownTick(seconds) {
                playBeep(800, 80);
            }

            function handleCountdownTick() {
                if (timerState.isPaused) return;
                var seconds = Math.ceil(timerState.currentTime);
                if (seconds >= 1 && seconds <= 3 && seconds !== lastCountdownSecond) {
                    lastCountdownSecond = seconds;
                    playCountdownTick(seconds);
                }
            }

            function playGong() {
                try {
                    initAudio();
                    if (!audioCtx) return;
                    var osc = audioCtx.createOscillator();
                    var gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.6);
                    gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.7);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.7);
                } catch (e) {}
            }

            function playExtraAlert() {
                playBeep(600, 150);
                setTimeout(function() { playBeep(900, 150); }, 180);
            }

            function playTickMetronome() { playBeep(1200, 30); }

            // ==============================
            // 6. CALCOLO DURATA TOTALE
            // ==============================
            function calculateTotalDuration() {
                var work = settings.work;
                var rest = settings.rest;
                var rounds = settings.rounds;
                var extraEvery = settings.extraEvery;
                var extraDur = settings.extraDur;
                if (rounds === 0) return 0;
                var total = (work + rest) * rounds;
                if (extraEvery > 0) {
                    var numExtras = Math.floor(rounds / extraEvery);
                    total += extraDur * numExtras;
                }
                total += 3;
                return total;
            }

            // ==============================
            // 7. TICK
            // ==============================
            function loadTickState() {
                try { tickEnabled = localStorage.getItem('pt_timer_tick') === 'true'; } catch (e) { tickEnabled = false; }
                tickToggle.classList.toggle('active', tickEnabled);
            }

            function saveTickState() {
                try { localStorage.setItem('pt_timer_tick', tickEnabled ? 'true' : 'false'); } catch (e) {}
            }
            tickToggle.addEventListener('click', function() {
                tickEnabled = !tickEnabled;
                this.classList.toggle('active', tickEnabled);
                saveTickState();
                if (timerState.status === 'work' && !timerState.isPaused) startTick();
                else stopTick();
            });

            function startTick() {
                stopTick();
                if (!tickEnabled || timerState.status !== 'work' || timerState.isPaused) return;
                tickInterval = setInterval(function() {
                    if (timerState.status === 'work' && !timerState.isPaused) playTickMetronome();
                    else stopTick();
                }, 1000);
            }

            function stopTick() { if (tickInterval) { clearInterval(tickInterval); tickInterval = null; } }

            // ==============================
            // 8. CUSTOM PRESETS
            // ==============================
            var customPresets = [];

            function loadCustomPresets() {
                try { var d = localStorage.getItem('pt_timer_custom_presets'); if (d) customPresets = JSON.parse(d);
                    else customPresets = []; } catch (e) { customPresets = []; }
                renderCustomPresets();
            }

            function saveCustomPresets() {
                try { localStorage.setItem('pt_timer_custom_presets', JSON.stringify(customPresets)); } catch (e) {}
                renderCustomPresets();
            }

            function renderCustomPresets() {
                customList.innerHTML = '';
                customPresets.forEach(function(p, idx) {
                    var wrapper = document.createElement('div');
                    wrapper.className = 'custom-preset-wrapper';
                    var btn = document.createElement('div');
                    btn.className = 'preset-btn custom-btn';
                    btn.textContent = p.name.length > 10 ? p.name.substring(0, 10) + '…' : p.name;
                    btn.title = p.name;
                    (function(i) {
                        btn.addEventListener('click', function() { loadCustomPresetByIndex(i); });
                    })(idx);
                    var del = document.createElement('div');
                    del.className = 'delete-btn';
                    del.textContent = '✖';
                    (function(i) {
                        del.addEventListener('click', function(e) {
                            e.stopPropagation();
                            if (confirm('Eliminare "' + p.name + '"?')) {
                                customPresets.splice(i, 1);
                                saveCustomPresets();
                            }
                        });
                    })(idx);
                    wrapper.appendChild(btn);
                    wrapper.appendChild(del);
                    customList.appendChild(wrapper);
                });
                var area = document.getElementById('new-preset-area');
                area.style.display = (customPresets.length >= 5) ? 'none' : 'flex';
            }

            function addCustomPreset(name) {
                if (customPresets.length >= 5) { alert('Hai già 5 preset!'); return; }
                if (!name || name.trim() === '') { alert('Inserisci un nome.'); return; }
                var current = {
                    work: parseInt(valWork.textContent, 10) || 30,
                    rest: parseInt(valRest.textContent, 10) || 15,
                    rounds: parseInt(valRounds.textContent, 10) || 8,
                    extraEvery: parseInt(valExtraEvery.textContent, 10) || 0,
                    extraDur: parseInt(valExtraDur.textContent, 10) || 60
                };
                customPresets.push({ name: name.trim(), work: current.work, rest: current.rest, rounds: current.rounds,
                    extraEvery: current.extraEvery, extraDur: current.extraDur });
                saveCustomPresets();
                newPresetName.value = '';
                alert('✅ Preset "' + name.trim() + '" salvato!');
            }

            function loadCustomPresetByIndex(idx) {
                if (timerState.status !== 'idle' && timerState.status !== 'finished') return;
                var p = customPresets[idx];
                if (!p) return;
                settings.work = p.work;
                settings.rest = p.rest;
                settings.rounds = p.rounds;
                settings.extraEvery = p.extraEvery;
                settings.extraDur = p.extraDur;
                syncUIFromSettings();
                timerState.totalRounds = settings.rounds;
                timerState.currentRound = 0;
                timerState.currentTime = settings.work;
                timerState.maxTime = settings.work;
                resetUI();
                updateUI();
                presetBtns.forEach(function(b) { b.classList.remove('active'); });
                document.querySelectorAll('.custom-preset-wrapper .preset-btn').forEach(function(b) { b.classList.remove('active'); });
                var wrappers = document.querySelectorAll('.custom-preset-wrapper');
                if (wrappers[idx]) {
                    var btn = wrappers[idx].querySelector('.preset-btn');
                    if (btn) btn.classList.add('active');
                }
            }

            btnAddCustom.addEventListener('click', function() { addCustomPreset(newPresetName.value); });
            newPresetName.addEventListener('keydown', function(e) { if (e.key === 'Enter') addCustomPreset(newPresetName.value); });

            // ==============================
            // 9. UI UPDATE
            // ==============================
            function updateDots() {
                var total = timerState.totalRounds || 1;
                var done = timerState.currentRound;
                progressDots.innerHTML = '';
                for (var i = 1; i <= total; i++) {
                    var dot = document.createElement('span');
                    dot.className = 'dot';
                    if (i < done) {
                        dot.classList.add('done');
                    } else if (i === done && timerState.status !== 'idle' && timerState.status !== 'finished') {
                        if (timerState.status === 'extra') {
                            dot.classList.add('extra-dot');
                        } else {
                            dot.classList.add('current');
                        }
                    }
                    progressDots.appendChild(dot);
                }
            }

            function updateUI() {
                bigNumber.textContent = Math.ceil(timerState.currentTime);
                roundsInfo.textContent = 'Giro ' + timerState.currentRound + ' / ' + timerState.totalRounds;
                updateDots();

                var progressInner = (timerState.maxTime > 0) ? (timerState.currentTime / timerState.maxTime) * 100 : 0;
                var offsetInner = CIRC_INNER - (progressInner / 100) * CIRC_INNER;
                ringInner.style.strokeDashoffset = offsetInner;

                var color = 'rgba(255,255,255,0.2)';
                var phaseClass = '';
                var isRestWarning = (timerState.status === 'rest' && timerState.currentTime <= 3 && timerState.currentTime > 0);
                if (timerState.status === 'work') { 
                    color = 'var(--work-green)';
                    phaseClass = 'phase-work'; 
                } else if (timerState.status === 'rest') {
                    if (isRestWarning) { 
                        color = 'var(--warning-yellow)';
                        phaseClass = 'phase-rest-warning'; 
                    } else { 
                        color = 'var(--rest-red)';
                        phaseClass = 'phase-rest'; 
                    }
                } else if (timerState.status === 'extra') { 
                    color = 'var(--extra-blue)';
                    phaseClass = 'phase-extra'; 
                } else if (timerState.status === 'countdown') { 
                    color = 'var(--primary-cyan)';
                    phaseClass = 'phase-countdown'; 
                } else if (timerState.status === 'finished') { 
                    color = 'var(--work-green)';
                    phaseClass = 'phase-finished'; 
                }
                ringInner.style.stroke = color;
                appDiv.classList.remove('phase-work', 'phase-rest', 'phase-rest-warning', 'phase-extra', 'phase-countdown', 'phase-finished');
                if (phaseClass) appDiv.classList.add(phaseClass);

                if (totalDuration > 0) {
                    var progressOuter = (totalElapsed / totalDuration) * 100;
                    if (progressOuter > 100) progressOuter = 100;
                    var offsetOuter = CIRC_OUTER - (progressOuter / 100) * CIRC_OUTER;
                    ringOuter.style.strokeDashoffset = offsetOuter;
                } else {
                    ringOuter.style.strokeDashoffset = CIRC_OUTER;
                }
            }

            function resetUI() {
                bigNumber.textContent = settings.work;
                roundsInfo.textContent = 'Giro 0 / ' + settings.rounds;
                phaseLabel.textContent = 'PRONTO';
                appDiv.classList.remove('phase-work', 'phase-rest', 'phase-rest-warning', 'phase-extra', 'phase-countdown', 'phase-finished');
                ringInner.style.strokeDashoffset = CIRC_INNER;
                ringInner.style.stroke = 'rgba(255,255,255,0.2)';
                ringOuter.style.strokeDashoffset = CIRC_OUTER;
                btnStart.style.display = 'flex';
                btnStart.textContent = 'PARTI';
                btnStart.className = 'ctrl-btn idle';
                btnPause.style.display = 'none';
                btnSkipBack.style.display = 'none';
                btnSkipForward.style.display = 'none';
                btnStop.style.display = 'none';
                timerState.currentRound = 0;
                timerState.totalRounds = settings.rounds;
                totalElapsed = 0;
                lastCountdownSecond = -1;
                updateDots();
                stopTick();
            }

            // ==============================
            // 10. TIMER ENGINE
            // ==============================
            function stopTimer() {
                if (timerState.timerInterval) {
                    clearInterval(timerState.timerInterval);
                    timerState.timerInterval = null;
                }
                stopTick();
            }

            function startCountdownInterval() {
                stopTimer();
                lastCountdownSecond = -1;
                timerState.timerInterval = setInterval(function() {
                    if (timerState.isPaused) return;
                    timerState.currentTime -= 0.1;
                    totalElapsed += 0.1;
                    handleCountdownTick();
                    if (timerState.currentTime <= 0) {
                        timerState.currentTime = 0;
                        updateUI();
                        setTimeout(function() {
                            playBeep(1200, 80);
                        }, 100);
                        startWorkPhase();
                        return;
                    }
                    updateUI();
                }, 100);
            }

            function startWorkInterval() {
                stopTimer();
                lastCountdownSecond = -1;
                timerState.timerInterval = setInterval(function() {
                    if (timerState.isPaused) return;
                    timerState.currentTime -= 0.1;
                    totalElapsed += 0.1;
                    handleCountdownTick();
                    if (timerState.currentTime <= 0) {
                        timerState.currentTime = 0;
                        updateUI();
                        playGong();
                        triggerVibration([300, 100, 300]);
                        if (timerState.currentRound >= timerState.totalRounds) {
                            finishWorkout();
                        } else {
                            startRestPhase();
                        }
                        return;
                    }
                    updateUI();
                }, 100);
                if (tickEnabled) startTick();
            }

            function startRestInterval() {
                stopTimer();
                lastCountdownSecond = -1;
                timerState.timerInterval = setInterval(function() {
                    if (timerState.isPaused) return;
                    timerState.currentTime -= 0.1;
                    totalElapsed += 0.1;
                    handleCountdownTick();
                    if (timerState.currentTime <= 0) {
                        timerState.currentTime = 0;
                        updateUI();
                        playBeep(1200, 80);
                        triggerVibration([200, 100, 200]);
                        var shouldTriggerExtra = (settings.extraEvery > 0) &&
                            (timerState.currentRound % settings.extraEvery === 0) &&
                            !timerState.extraTriggeredThisRound &&
                            (timerState.currentRound < timerState.totalRounds);
                        if (shouldTriggerExtra) {
                            timerState.extraTriggeredThisRound = true;
                            startExtraPhase();
                        } else {
                            startWorkPhase();
                        }
                        return;
                    }
                    updateUI();
                }, 100);
            }

            function startExtraInterval() {
                stopTimer();
                lastCountdownSecond = -1;
                timerState.timerInterval = setInterval(function() {
                    if (timerState.isPaused) return;
                    timerState.currentTime -= 0.1;
                    totalElapsed += 0.1;
                    handleCountdownTick();
                    if (timerState.currentTime <= 0) {
                        timerState.currentTime = 0;
                        updateUI();
                        playBeep(1000, 400);
                        triggerVibration([300]);
                        startWorkPhase();
                        return;
                    }
                    updateUI();
                }, 100);
            }

            // ==============================
            // 11. FUNZIONI DI AVVIO FASI
            // ==============================
            function startCountdown() {
                stopTimer();
                triggerVibration([100, 100, 100]);
                timerState.status = 'countdown';
                timerState.currentTime = 3;
                timerState.maxTime = 3;
                timerState.isPaused = false;
                phaseLabel.textContent = 'PARTENZA';
                btnSkipBack.style.display = 'none';
                btnSkipForward.style.display = 'none';
                btnStop.style.display = 'none';
                updateUI();
                startCountdownInterval();
            }

            function startWorkPhase() {
                stopTimer();
                triggerVibration([200]);
                timerState.status = 'work';
                timerState.currentRound += 1;
                timerState.currentTime = settings.work;
                timerState.maxTime = settings.work;
                timerState.isPaused = false;
                timerState.extraTriggeredThisRound = false;
                phaseLabel.textContent = 'LAVORO';
                btnSkipBack.style.display = 'flex';
                btnSkipBack.textContent = '◀ IND.';
                btnSkipForward.style.display = 'flex';
                btnSkipForward.textContent = '▶ AVV.';
                btnStop.style.display = 'flex';
                updateUI();
                startWorkInterval();
            }

            function startRestPhase() {
                stopTimer();
                triggerVibration([100]);
                timerState.status = 'rest';
                timerState.currentTime = settings.rest;
                timerState.maxTime = settings.rest;
                timerState.isPaused = false;
                phaseLabel.textContent = 'RECUPERO';
                btnSkipBack.style.display = 'flex';
                btnSkipBack.textContent = '◀ IND.';
                btnSkipForward.style.display = 'flex';
                btnSkipForward.textContent = '▶ AVV.';
                btnStop.style.display = 'flex';
                updateUI();
                stopTick();
                startRestInterval();
            }

            function startExtraPhase() {
                stopTimer();
                triggerVibration([100, 50, 100]);
                timerState.status = 'extra';
                timerState.currentTime = settings.extraDur;
                timerState.maxTime = settings.extraDur;
                timerState.isPaused = false;
                phaseLabel.textContent = 'EXTRA ATTIVO';
                btnSkipBack.style.display = 'flex';
                btnSkipBack.textContent = '◀ IND.';
                btnSkipForward.style.display = 'flex';
                btnSkipForward.textContent = '▶ AVV.';
                btnStop.style.display = 'flex';
                updateUI();
                playExtraAlert();
                stopTick();
                startExtraInterval();
            }

            function finishWorkout() {
                stopTimer();
                triggerVibration([100, 50, 100, 50, 300]);
                timerState.status = 'finished';
                timerState.currentTime = 0;
                phaseLabel.textContent = 'COMPLETATO';
                bigNumber.textContent = '0';
                roundsInfo.textContent = 'Giro ' + timerState.currentRound + ' / ' + timerState.totalRounds;
                ringInner.style.strokeDashoffset = 0;
                ringInner.style.stroke = 'var(--work-green)';
                ringOuter.style.strokeDashoffset = 0;
                if (totalDuration > 0) totalElapsed = totalDuration;
                appDiv.classList.add('phase-finished');
                btnStart.style.display = 'flex';
                btnStart.textContent = 'RIAVVIA';
                btnStart.className = 'ctrl-btn idle';
                btnPause.style.display = 'none';
                btnSkipBack.style.display = 'none';
                btnSkipForward.style.display = 'none';
                btnStop.style.display = 'none';
                updateDots();
                stopTick();
                setTimeout(function() { playBeep(523, 200); }, 100);
                setTimeout(function() { playBeep(659, 200); }, 300);
                setTimeout(function() { playBeep(784, 400); }, 500);
            }

            // ==============================
            // 12. SKIP BACK
            // ==============================
            function skipBack() {
                if (timerState.status === 'idle' || timerState.status === 'finished') return;
                if (timerState.isPaused) return;

                var s = timerState.status;

                if (s === 'work') {
                    if (timerState.currentRound > 1) {
                        timerState.currentRound -= 1;
                        timerState.status = 'rest';
                        timerState.currentTime = settings.rest;
                        timerState.maxTime = settings.rest;
                        timerState.extraTriggeredThisRound = false;
                        phaseLabel.textContent = 'RECUPERO';
                        btnSkipBack.textContent = '◀ IND.';
                        btnSkipForward.textContent = '▶ AVV.';
                        btnStop.style.display = 'flex';
                        updateUI();
                        triggerVibration([100]);
                        stopTick();
                        startRestInterval();
                        btnStart.textContent = 'PAUSA';
                        btnStart.className = 'ctrl-btn running';
                    }
                } else if (s === 'rest') {
                    timerState.status = 'work';
                    timerState.currentTime = settings.work;
                    timerState.maxTime = settings.work;
                    phaseLabel.textContent = 'LAVORO';
                    btnSkipBack.textContent = '◀ IND.';
                    btnSkipForward.textContent = '▶ AVV.';
                    btnStop.style.display = 'flex';
                    updateUI();
                    triggerVibration([200]);
                    startWorkInterval();
                    btnStart.textContent = 'PAUSA';
                    btnStart.className = 'ctrl-btn running';
                } else if (s === 'extra') {
                    timerState.status = 'work';
                    timerState.currentTime = settings.work;
                    timerState.maxTime = settings.work;
                    phaseLabel.textContent = 'LAVORO';
                    btnSkipBack.textContent = '◀ IND.';
                    btnSkipForward.textContent = '▶ AVV.';
                    btnStop.style.display = 'flex';
                    updateUI();
                    triggerVibration([200]);
                    startWorkInterval();
                    btnStart.textContent = 'PAUSA';
                    btnStart.className = 'ctrl-btn running';
                } else if (s === 'countdown') {
                    // non fare nulla
                }
            }

            // ==============================
            // 13. SKIP FORWARD
            // ==============================
            function skipForward() {
                if (timerState.status === 'idle' || timerState.status === 'finished') return;
                if (timerState.isPaused) return;
                var remaining = timerState.currentTime;
                if (remaining > 0) totalElapsed += remaining;
                stopTimer();
                stopTick();
                var s = timerState.status;
                if (s === 'work') {
                    playGong();
                    triggerVibration([200]);
                    if (timerState.currentRound >= timerState.totalRounds) {
                        finishWorkout();
                    } else {
                        var shouldTriggerExtra = (settings.extraEvery > 0) &&
                            (timerState.currentRound % settings.extraEvery === 0) &&
                            !timerState.extraTriggeredThisRound &&
                            (timerState.currentRound < timerState.totalRounds);
                        if (shouldTriggerExtra) {
                            timerState.extraTriggeredThisRound = true;
                            startExtraPhase();
                        } else {
                            startRestPhase();
                        }
                    }
                } else if (s === 'rest') {
                    playBeep(1200, 80);
                    triggerVibration([100]);
                    startWorkPhase();
                } else if (s === 'extra') {
                    playBeep(1000, 200);
                    triggerVibration([100]);
                    startWorkPhase();
                } else if (s === 'countdown') {
                    startWorkPhase();
                }
                updateUI();
            }

            // ==============================
            // 14. STOP / PAUSA / RESET
            // ==============================
            function stopAll() {
                stopTimer();
                stopTick();
                timerState.status = 'idle';
                timerState.currentRound = 0;
                timerState.isPaused = false;
                timerState.extraTriggeredThisRound = false;
                timerState.currentTime = settings.work;
                timerState.maxTime = settings.work;
                timerState.totalRounds = settings.rounds;
                totalElapsed = 0;
                lastCountdownSecond = -1;
                syncUIFromSettings();
                resetUI();
                updateUI();
            }

            function togglePause() {
                if (timerState.status === 'idle' || timerState.status === 'finished') return;
                if (timerState.isPaused) {
                    timerState.isPaused = false;
                    btnStart.textContent = 'PAUSA';
                    btnStart.className = 'ctrl-btn running';
                    var s = timerState.status;
                    if (s === 'work') startWorkInterval();
                    else if (s === 'rest') startRestInterval();
                    else if (s === 'extra') startExtraInterval();
                    else if (s === 'countdown') startCountdownInterval();
                } else {
                    timerState.isPaused = true;
                    btnStart.textContent = 'RIPRENDI';
                    btnStart.className = 'ctrl-btn idle';
                    stopTimer();
                    stopTick();
                    updateUI();
                }
            }

            function resetAll() {
                stopAll();
            }

            // ==============================
            // 15. HELPER PER SETTINGS
            // ==============================
            function syncUIFromSettings() {
                valWork.textContent = settings.work;
                valRest.textContent = settings.rest;
                valRounds.textContent = settings.rounds;
                valExtraEvery.textContent = settings.extraEvery;
                valExtraDur.textContent = settings.extraDur;
            }

            function loadSettingsIntoState() {
                settings.work = parseInt(valWork.textContent, 10) || 30;
                settings.rest = parseInt(valRest.textContent, 10) || 15;
                settings.rounds = parseInt(valRounds.textContent, 10) || 8;
                settings.extraEvery = parseInt(valExtraEvery.textContent, 10) || 0;
                settings.extraDur = parseInt(valExtraDur.textContent, 10) || 60;
                timerState.totalRounds = settings.rounds;
                if (timerState.status === 'idle' || timerState.status === 'finished') {
                    timerState.currentTime = settings.work;
                    timerState.maxTime = settings.work;
                    bigNumber.textContent = settings.work;
                    roundsInfo.textContent = 'Giro 0 / ' + settings.rounds;
                    ringInner.style.strokeDashoffset = CIRC_INNER;
                    ringInner.style.stroke = 'rgba(255,255,255,0.2)';
                    ringOuter.style.strokeDashoffset = CIRC_OUTER;
                    phaseLabel.textContent = 'PRONTO';
                    appDiv.classList.remove('phase-work', 'phase-rest', 'phase-rest-warning', 'phase-extra',
                        'phase-countdown', 'phase-finished');
                    updateDots();
                }
            }

            // ==============================
            // 16. PRESET STANDARD
            // ==============================
            function loadPreset(name) {
                if (timerState.status !== 'idle' && timerState.status !== 'finished') return;
                var preset = PRESETS[name];
                if (!preset) return;
                settings.work = preset.work;
                settings.rest = preset.rest;
                settings.rounds = preset.rounds;
                settings.extraEvery = preset.extraEvery;
                settings.extraDur = preset.extraDur;
                syncUIFromSettings();
                timerState.totalRounds = settings.rounds;
                timerState.currentRound = 0;
                timerState.currentTime = settings.work;
                timerState.maxTime = settings.work;
                totalElapsed = 0;
                resetUI();
                updateUI();
                presetBtns.forEach(function(b) { b.classList.remove('active'); });
                var target = document.querySelector('#drawer .preset-btn[data-preset="' + name + '"]');
                if (target) target.classList.add('active');
                document.querySelectorAll('.custom-preset-wrapper .preset-btn').forEach(function(b) { b.classList.remove('active'); });
            }

            // ==============================
            // 17. START
            // ==============================
            function handleStart() {
                initAudio();
                if (timerState.status === 'idle' || timerState.status === 'finished') {
                    loadSettingsIntoState();
                    totalDuration = calculateTotalDuration();
                    if (totalDuration <= 0) totalDuration = 1;
                    totalElapsed = 0;
                    timerState.currentRound = 0;
                    timerState.extraTriggeredThisRound = false;
                    timerState.currentTime = settings.work;
                    timerState.maxTime = settings.work;
                    btnStart.textContent = 'PAUSA';
                    btnStart.className = 'ctrl-btn running';
                    btnSkipBack.style.display = 'none';
                    btnSkipForward.style.display = 'none';
                    btnStop.style.display = 'none';
                    startCountdown();
                } else {
                    togglePause();
                }
            }

            // ==============================
            // 18. ADJUST VALUE
            // ==============================
            function isRunning() { return timerState.status !== 'idle' && timerState.status !== 'finished'; }

            function adjustValue(el, delta, min, max) {
                if (isRunning()) return;
                var val = parseInt(el.textContent, 10) + delta;
                if (val < min) val = min;
                if (val > max) val = max;
                el.textContent = val;
                if (timerState.status === 'idle' || timerState.status === 'finished') {
                    loadSettingsIntoState();
                    resetUI();
                    updateUI();
                }
            }

            // ==============================
            // 19. EVENTI
            // ==============================
            document.getElementById('dec-work').addEventListener('click', function() { adjustValue(valWork, -1, 3, 300); });
            document.getElementById('inc-work').addEventListener('click', function() { adjustValue(valWork, 1, 3, 300); });
            document.getElementById('dec-rest').addEventListener('click', function() { adjustValue(valRest, -1, 1, 300); });
            document.getElementById('inc-rest').addEventListener('click', function() { adjustValue(valRest, 1, 1, 300); });
            document.getElementById('dec-rounds').addEventListener('click', function() { adjustValue(valRounds, -1, 1, 99); });
            document.getElementById('inc-rounds').addEventListener('click', function() { adjustValue(valRounds, 1, 1, 99); });
            document.getElementById('dec-extra-every').addEventListener('click', function() { adjustValue(valExtraEvery, -1, 0, 99); });
            document.getElementById('inc-extra-every').addEventListener('click', function() { adjustValue(valExtraEvery, 1, 0, 99); });
            document.getElementById('dec-extra-dur').addEventListener('click', function() { adjustValue(valExtraDur, -1, 5, 600); });
            document.getElementById('inc-extra-dur').addEventListener('click', function() { adjustValue(valExtraDur, 1, 5, 600); });

            presetBtns.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    loadPreset(btn.getAttribute('data-preset'));
                });
            });

            btnStart.addEventListener('click', handleStart);
            btnSkipBack.addEventListener('click', skipBack);
            btnSkipForward.addEventListener('click', skipForward);
            btnStop.addEventListener('click', stopAll);

            // ==============================
            // 20. WAKE LOCK
            // ==============================
            if ('wakeLock' in navigator) {
                var wl = null;
                var reqLock = function() {
                    try {
                        navigator.wakeLock.request('screen').then(function(lock) { wl = lock; }).catch(function() {});
                    } catch (e) {}
                };
                reqLock();
                document.addEventListener('visibilitychange', function() {
                    if (document.visibilityState === 'visible' && wl === null) reqLock();
                });
            }

            // ==============================
            // 21. INIT
            // ==============================
            loadTickState();
            loadCustomPresets();
            loadPreset('hiit');
        });
    </script>
</body>
</html>
